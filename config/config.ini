[database]
host = localhost
port = 5432
name = droughts
user = postgres
password = postgres

[map]
center_lat = 0
center_lon = 0
initial_zoom = 6
min_zoom = 3
max_zoom = 8
base_map_url = https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
layers = era5_ecowas,era5_ecowas_2025_notime,era5_temp_ecowas,meteo_stations
get_feature_info_url = http://localhost:5000/get_feature_info
topics = precipitation,temperature,point_layer
precipitation = era5_ecowas,era5_ecowas_2025_notime
temperature =  	era5_temp_ecowas
point_layer = meteo_stations

[era5_ecowas]
url = http://localhost:8080/geoserver/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:era5_ecowas_data_view&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
info = <p>ERA5 precipitation data, monthly 1991-2020. etc...</p>
active = true
opacity = 0.7
tms = false
time = true
dateformat = yyyy-mm
table = era5_ecowas
topic = precipitation
legend = http://localhost:8080/geoserver/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=droughts:era5_ecowas_data_view&format=image/png
chart_color_min = rgba(56, 140, 193, 0.8)
chart_color_max = rgba(48, 34, 179, 0.8)

[era5_ecowas_2025_notime]
url = http://localhost:8080/geoserver/gwc/service/tms/1.0.0/droughts:era5_ecowas_data_view@WebMercatorQuad@png/{z}/{x}/{y}.png
info = <p>ERA5 precipitation data no time dimension...</p>
active = false
opacity = 0
tms = true
time = false
table = era5_ecowas
topic = precipitation
legend = http://localhost:8080/geoserver/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=droughts:era5_ecowas_data_view&format=image/png

[era5_temp_ecowas]
url = http://localhost:8080/geoserver/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:era5_temp_ecowas_data_view&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
info = <p>ERA5 temperature data, monthly 1991-2025. etc...</p>
active = false
opacity = 0.7
tms = false
time = true
dateformat = yyyy-mm
table = era5_temp_ecowas
topic = temperature
legend = http://localhost:8080/geoserver/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=droughts:era5_temp_ecowas_data_view&format=image/png
chart_color_min = rgba(201, 115, 16, 0.8)
chart_color_max = rgba(255, 17, 0, 0.8)

[meteo_stations]
url = http://localhost:8080/geoserver/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:meteostation_month_data&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
get_feature_info_url = http://localhost:5000/get_meteostation_info
info = <p>Meteo stations</p>
active = false
opacity = 0.8
time = true
dateformat = yyyy-mm
table = meteostation_month_data
topic = point_layer