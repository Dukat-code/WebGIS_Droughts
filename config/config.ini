[database]
host = localhost
port = 5432
name = droughts
user = postgres
password = postgres

[map]
center_lat = 0
center_lon = 0
initial_zoom = 6
min_zoom = 3
max_zoom = 8
base_map_url = https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
layers = era5_ecowas_prec,era5_temp_ecowas,era5_ecowas_temp,meteo_stations
get_feature_info_url = http://localhost:5000/get_feature_info
topics = precipitation,temperature,facilities
precipitation = era5_ecowas_prec
temperature =  	era5_temp_ecowas,era5_ecowas_temp
facilities = meteo_stations

[grids]

1 = grid_1dd
0.5 = grid_05dd
0.25 = grid_025dd

[era5_ecowas_prec]
url = http://localhost:8080/geoserver/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:era5_ecowas_prec&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
info = <p>ERA5 precipitation data, monthly 1991-2020. etc...</p>
active = true
opacity = 0.7
tms = false
time = true
dateformat = yyyy-mm
topic = precipitation
legend = http://localhost:8080/geoserver/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=droughts:era5_ecowas_prec&format=image/png
chart_color_min = rgba(56, 140, 193, 0.8)
chart_color_max = rgba(48, 34, 179, 0.8)

[era5_temp_ecowas]
url = http://localhost:8080/geoserver/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:era5_temp_ecowas_data_view&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
info = <p>ERA5 temperature data, monthly 1991-2025. etc...</p>
active = false
opacity = 0.7
tms = false
time = true
dateformat = yyyy-mm
topic = temperature
legend = http://localhost:8080/geoserver/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=droughts:era5_temp_ecowas_data_view&format=image/png
chart_color_min = rgba(201, 115, 16, 0.8)
chart_color_max = rgba(255, 17, 0, 0.8)

[era5_ecowas_temp]
url = http://localhost:8080/geoserver/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:era5_ecowas_temp&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
info = <p>ERA5 temperature data, monthly 1991-2025. etc...</p>
active = false
opacity = 0.7
tms = false
time = true
dateformat = yyyy-mm
topic = temperature
legend = http://localhost:8080/geoserver/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=droughts:era5_ecowas_temp&format=image/png
chart_color_min = rgba(201, 115, 16, 0.8)
chart_color_max = rgba(255, 17, 0, 0.8)

[meteo_stations]
url = http://localhost:5000/get_all_meteostations
get_feature_info_url = http://localhost:5000/get_meteostation_info
info = <p>Meteo stations</p>
active = false
opacity = 0.8
dateformat = yyyy-mm
topic = facilities
chart_color_min = rgba(56, 140, 193, 0.8)
chart_color_max = rgba(48, 34, 179, 0.8)