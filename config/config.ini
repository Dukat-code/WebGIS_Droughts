[base]
base_url = http://localhost:5000
geoserver_url = http://localhost:8080/geoserver

[geoserver]
username = admin
password = geoserver

[database]
host = localhost
port = 5432
dbname = droughts
user = postgres
password = postgres

[map]
center_lat = 0
center_lon = 0
initial_zoom = 6
min_zoom = 3
max_zoom = 8
base_map_url = https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
layers = era5_ecowas_prec,era5_ecowas_temp,era5_ecowas_spi1,meteo_stations
get_feature_info_url = {base_url}/get_feature_info
topics = precipitation,temperature,indexes,facilities
precipitation = era5_ecowas_prec
temperature = era5_ecowas_temp
indexes = era5_ecowas_spi1
facilities = meteo_stations

[grids]
1 = grid_1dd
0.5 = grid_05dd
0.25 = grid_025dd

[era5_ecowas_prec]
url = {geoserver_url}/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:era5_ecowas_prec&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
info = <p>ERA5 precipitation data, monthly 1991-2020. etc...</p>
active = true
opacity = 0.7
tms = false
time = true
date_format = yyyy-mm
topic = precipitation
legend = {geoserver_url}/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=droughts:era5_ecowas_prec&format=image/png
chart_color_min = rgba(56, 140, 193, 0.8)
chart_color_max = rgba(48, 34, 179, 0.8)
resolution = 0.25

[era5_ecowas_temp]
url = {geoserver_url}/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:era5_ecowas_temp_2&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
info = <p>ERA5 temperature data, monthly 1991-2025. etc...</p>
active = false
opacity = 0.7
tms = false
time = true
date_format = yyyy-mm
topic = temperature
legend = {geoserver_url}/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=droughts:era5_ecowas_temp_2&format=image/png
chart_color_min = rgba(201, 115, 16, 0.8)
chart_color_max = rgba(255, 17, 0, 0.8)
resolution = 0.25

[era5_ecowas_spi1]
url = {geoserver_url}/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:era5_ecowas_spi1&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
info = <p>ERA5 SPI data, 10 days, 2025 </p>
active = false
opacity = 0.7
tms = false
time = true
date_format = yyyy-mm-dd
topic = indexes
legend = {geoserver_url}/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=droughts:era5_ecowas_spi1&format=image/png
chart_color_min = rgba(201, 115, 16, 0.8)
chart_color_max = rgba(255, 17, 0, 0.8)
style = spi1.sld
resolution = 0.25

[meteo_stations]
url = {base_url}/get_all_meteostations
get_feature_info_url = {base_url}/get_meteostation_info
info = <p>Meteo stations</p>
active = false
opacity = 0.8
date_format = yyyy-mm
topic = facilities
chart_color_min = rgba(56, 140, 193, 0.8)
chart_color_max = rgba(48, 34, 179, 0.8)

[precipitation3]
url = {geoserver_url}/droughts/gwc/service/wmts?TIME=1991-01-01&layer=droughts:era5_ecowas_prec&style=&tilematrixset=WebMercatorQuad&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}
info = <p>ERA5 precipitation data, monthly 1991-2020. etc...</p>
active = true
opacity = 0.7
