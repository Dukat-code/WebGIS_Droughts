{% extends "admin_dashboard.html" %}
{% block content %}
<h2>Edit Configuration (Raw)</h2>
{% if message %}
    <div style="color: green;">{{ message }}</div>
{% endif %}
<form method="post">
    <textarea name="config_raw" rows="30" style="width:100%;">{{ config_raw }}</textarea>
    <br>
    <button type="submit">Save</button>
    <a href="{{ url_for('admin_dashboard') }}" style="margin-left:10px;">
        <button type="button">Cancel</button>
    </a>
</form>
{% endblock %}
