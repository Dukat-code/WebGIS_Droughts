{% extends "admin_dashboard.html" %}
{% block content %}
{% if message %}
    <div style="color: green;">{{ message }}</div>
{% endif %}
<h2>Upload new data file</h2>
<form method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button type="submit">Upload</button>
</form>

<br><hr><br>
<h2>Published Data</h2>
<ul>
    {% for fname in uploaded_files %}
        <li>
            {{ fname }}
            <form method="post" style="display:inline;">
                <input type="hidden" name="delete_file" value="{{ fname }}">
                <button type="submit" onclick="return confirm('Delete {{ fname }}?');">Delete</button>
            </form>
            <form method="post" style="display:inline;">
                <input type="hidden" name="download_file" value="{{ fname }}">
                <button type="submit">Download</button>
            </form>
        </li>
    {% else %}
        <li>No files uploaded yet.</li>
    {% endfor %}
</ul>
{% endblock %}
