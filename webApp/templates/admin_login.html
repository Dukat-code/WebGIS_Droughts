<!DOCTYPE html>
<html>
<head><title>Admin Login</title></head>
<body>
    <h2>Admin Login</h2>
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    <style>
        .aligned-form-login {
            width: 350px;
        }
        .aligned-form-login label {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .aligned-form-login label span {
            width: 100px;
            text-align: left;
            margin-right: 10px;
            display: inline-block;
        }
        .aligned-form-login input[type="text"],
        .aligned-form-login input[type="password"] {
            width: 220px;
            padding: 5px;
            box-sizing: border-box;
            margin-left: 0;
        }
        .aligned-form-login input[type="submit"] {
            margin-left: 110px;
        }
    </style>
    <form method="post" class="aligned-form-login">
        <label><span>Username:</span> <input type="text" name="username"></label>
        <label><span>Password:</span> <input type="password" name="password"></label>
        <input type="submit" value="Login">
    </form>
</body>
</html>
