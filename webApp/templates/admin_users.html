<!DOCTYPE html>
<html>
<head><title>Manage Admin Users</title></head>
<body>
    <h2>Manage Admin Users</h2>
    {% if message %}<p>{{ message }}</p>{% endif %}
    <form method="post">
        <label>Username: <input type="text" name="username"></label><br>
        <label>Password: <input type="password" name="password"></label><br>
        <button type="submit" name="action" value="create">Create User</button>
        <button type="submit" name="action" value="delete">Delete User</button>
        <button type="submit" name="action" value="change_password">Change Password</button>
    </form>
    <a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>
</body>
</html>
